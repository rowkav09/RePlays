name: Linux Build

on:
  push:
    branches: [main, linux-build]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # EnforceCodeStyleInBuild is off because .editorconfig asks for CRLF
      # and a Linux checkout is LF
      - name: Build
        run: dotnet build RePlays.csproj -c ${{ matrix.configuration }} -r linux-x64 -p:EnforceCodeStyleInBuild=false -p:RunAnalyzers=false

  package:
    name: Package (tar.gz)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # the csproj Publish target is Windows only (Velopack, win-x64 libobs), so
      # the package is put together from the build output instead
      - name: Build
        run: dotnet build RePlays.csproj -c Release -r linux-x64 -p:EnforceCodeStyleInBuild=false -p:RunAnalyzers=false

      - name: Build frontend
        working-directory: ClientApp
        run: |
          npm ci
          npm run build

      - name: Assemble
        run: |
          out=RePlays-linux-x64
          mkdir -p "$out/ClientApp"
          cp -r bin/Release/net8.0/linux-x64/. "$out/"
          rm -rf "$out/cfg"
          cp -r ClientApp/build "$out/ClientApp/build"
          cp -r Resources/. "$out/Resources/"
          cp ClientApp/node_modules/ffmpeg-ffprobe-static/ffmpeg ClientApp/node_modules/ffmpeg-ffprobe-static/ffprobe "$out/"
          cp LICENSE "$out/"
          cat > "$out/README-linux.txt" <<'TXT'
          Runtime packages (Ubuntu 22.04 names): libgtk-3-0 libwebkit2gtk-4.1-0 (or libwebkit2gtk-4.0-37) libx11-6
          On Fedora: gtk3 webkit2gtk4.1 libX11 (webkit2gtk4.0 also works)
          For a system tray icon, install libayatana-appindicator3-1 on Ubuntu or libayatana-appindicator-gtk3 on Fedora.
          Run ./RePlays from this folder.
          libobs.so is not included, so recording is unavailable until it is placed next to RePlays.
          TXT
          tar -czf RePlays-linux-x64.tar.gz "$out"
          ls -lh RePlays-linux-x64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: RePlays-linux-x64
          path: RePlays-linux-x64.tar.gz

  smoke:
    name: Startup smoke test (${{ matrix.name }})
    needs: package
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: WebKitGTK 4.0
            packages: libwebkit2gtk-4.0-37 libayatana-appindicator3-1
            start-minimized: 'false'
          - name: WebKitGTK 4.1
            packages: libwebkit2gtk-4.1-0 libayatana-appindicator3-1
            start-minimized: 'false'
          - name: WebKitGTK 4.1 without a tray
            packages: libwebkit2gtk-4.1-0
            start-minimized: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: RePlays-linux-x64

      - name: Install runtime libraries
        env:
          EXTRA_PACKAGES: ${{ matrix.packages }}
        run: |
          sudo apt-get update
          read -r -a extra_packages <<< "$EXTRA_PACKAGES"
          sudo apt-get install -y --no-install-recommends xvfb xauth libgtk-3-0 "${extra_packages[@]}"

      - name: Launch the packaged app and check its interface
        run: bash tests/linux-package-smoke.sh RePlays-linux-x64.tar.gz ${{ matrix.start-minimized }}
